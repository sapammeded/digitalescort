<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#0a0f1a">
    <title>VMS | Tactical Tracker v3.9 · WORKING</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent;}
        body{font-family:'Segoe UI',Roboto,system-ui;background:#0a0f1a;overflow:hidden;position:fixed;width:100%;height:100%;}
        #map{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;background:#101624;}
        #canvas3D{position:absolute;top:0;left:0;width:100%;height:100%;z-index:2;background:#0c1122;display:none;}
        .status-bar{position:fixed;top:12px;left:12px;right:12px;z-index:1100;background:rgba(10,15,26,0.92);backdrop-filter:blur(12px);border-radius:28px;padding:8px 16px;font-family:'SF Mono','Courier New',monospace;font-size:11px;font-weight:500;box-shadow:0 4px 14px rgba(0,0,0,0.5);border:1px solid rgba(72,187,255,0.2);pointer-events:none;color:#eef2ff;}
        .status-grid{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;}
        .status-item{display:flex;align-items:center;gap:6px;letter-spacing:0.2px;}
        .led{width:8px;height:8px;border-radius:50%;transition:all 0.1s;}
        .led-green{background:#00f2a0;box-shadow:0 0 8px #00f2a0;animation:pulseGreen 1.2s infinite;}
        .led-red{background:#ff4d6d;}
        .led-yellow{background:#ffb347;animation:pulseYellow 0.9s infinite;}
        @keyframes pulseGreen{0%{opacity:0.4;}100%{opacity:1;transform:scale(1.2);}}
        @keyframes pulseYellow{0%{opacity:0.5;}100%{opacity:1;}}
        .tab-bar{position:fixed;top:80px;left:12px;right:12px;z-index:1100;display:flex;gap:10px;}
        .tab-btn{flex:1;background:#141c2c;border:none;border-radius:40px;padding:10px 0;font-weight:700;font-size:13px;cursor:pointer;color:#9aaec5;transition:0.2s;backdrop-filter:blur(4px);}
        .tab-btn.active{background:#1e88e5;color:white;box-shadow:0 0 12px #1e88e5;}
        .control-panel{position:fixed;bottom:20px;left:12px;right:12px;z-index:1050;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;pointer-events:none;}
        button{pointer-events:auto;background:#1e2a3e;border:none;padding:9px 14px;border-radius:44px;font-size:11px;font-weight:700;font-family:monospace;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.4);color:#f0f3fa;transition:0.05s linear;}
        button:active{transform:scale(0.96);}
        .btn-start{background:#00c48a;color:#0a0f1a;}
        .btn-stop{background:#ff5a5f;color:white;}
        .btn-sync{background:#ffb347;}
        .btn-clear{background:#6c7a89;}
        .btn-center{background:#1e88e5;}
        .btn-save{background:#00b0b9;}
        .btn-history{background:#9b59b6;}
        .btn-return{background:#fd7e2c;}
        .btn-sheet{background:#2c6e2f;}
        .history-panel{position:fixed;top:135px;left:12px;right:12px;bottom:100px;z-index:1150;background:rgba(18,25,40,0.98);border-radius:28px;padding:16px;overflow-y:auto;box-shadow:0 12px 28px rgba(0,0,0,0.5);border:1px solid #2c3e5c;display:none;backdrop-filter:blur(8px);color:#eef2ff;}
        .history-panel.show{display:block;}
        .history-item{background:#0f172a;margin:8px 0;padding:10px;border-radius:20px;cursor:pointer;border:1px solid #2a3a55;}
        .breadcrumb-info{position:fixed;bottom:95px;left:16px;background:rgba(0,0,0,0.85);backdrop-filter:blur(16px);padding:8px 18px;border-radius:40px;font-family:monospace;font-size:12px;color:#ffd966;z-index:1060;display:none;gap:8px;pointer-events:none;}
        .breadcrumb-info.show{display:flex;}
        .stats-mini{position:fixed;bottom:20px;right:16px;background:rgba(0,0,0,0.7);padding:5px 12px;border-radius:40px;font-size:10px;font-family:monospace;color:#b9e6ff;z-index:1020;pointer-events:none;}
        @media (max-width:640px){button{padding:7px 10px;font-size:10px;}.status-bar{font-size:9px;}}
        .playback-bar{position:fixed;bottom:85px;left:12px;right:12px;background:#111a28cc;backdrop-filter:blur(16px);border-radius:60px;padding:10px 16px;display:flex;gap:12px;align-items:center;z-index:1080;border:1px solid #3a4c70;display:none;}
        .playback-bar.show{display:flex;}
    </style>
</head>
<body>
<div id="map"></div>
<canvas id="canvas3D"></canvas>
<div class="status-bar"><div class="status-grid"><div class="status-item"><span class="led" id="gpsLed"></span><span id="gpsText">GPS: --</span></div>
<div class="status-item"><span class="led" id="syncLed"></span><span id="syncText">Sync: --</span></div><div class="status-item">📍<span id="pointCounter">0</span></div>
<div class="status-item">🎯<span id="accuracyText">--m</span></div><div class="status-item">⬆️<span id="altText">0m</span></div></div></div>
<div class="tab-bar"><button id="btn2D" class="tab-btn active">🗺️ 2D MAP</button><button id="btn3D" class="tab-btn">📐 3D TRAIL</button></div>
<div class="control-panel"><button id="startBtn" class="btn-start">▶ START</button><button id="stopBtn" class="btn-stop" style="display:none">⏹ STOP</button>
<button id="syncBtn" class="btn-sync">🔄 SYNC</button><button id="clearBtn" class="btn-clear">🗑 CLEAR</button><button id="centerBtn" class="btn-center">🎯 CENTER</button>
<button id="saveBtn" class="btn-save">💾 SAVE</button><button id="historyBtn" class="btn-history">📋 LIST</button><button id="returnBtn" class="btn-return">🏠 RETURN</button>
<button id="sheetBtn" class="btn-sheet">📊 SHEET</button><button id="playbackToggleBtn" class="btn-sheet" style="background:#6c5ce7;">🎬 REPLAY</button></div>
<div class="stats-mini" id="statsBox">Points:0 | Saved:0</div>
<div class="history-panel" id="historyPanel"><div class="history-title">📁 SAVED TRACKS (klik muat)</div><div id="historyList">Kosong</div></div>
<div class="breadcrumb-info" id="breadcrumbInfo">🧭 BACKTRACK (true path): <span id="returnDistance">0</span> meter</div>
<div class="playback-bar" id="playbackBar"><span>🎞️ REPLAY</span><input type="range" id="playbackSlider" min="0" max="100" value="0" style="flex:1"><span id="playbackPercent">0%</span><button id="playPauseBtn" style="background:#6c5ce7;padding:4px 12px;">⏸️</button><button id="stopPlaybackBtn" style="background:#e74c3c;">⏹️</button></div>
<script>
(function(){
    // ======================= V3.9 WORKING - FULLY TESTED =======================
    const CONFIG = {
        SYNC_URL: 'https://trackingrecord.sapammeded.workers.dev/api/v1/sync',
        MAX_POINTS_RAM: 5000,
        BATCH_SYNC: 20,
        AUTO_SYNC_INTERVAL_MS: 30000,
        GPS_OPTIONS: { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 },
        MAX_SPEED_MS: 38.0,
        MAX_JUMP_METERS: 65,
        MIN_ACCURACY_METERS: 18,
        SMOOTHING_FACTOR: 0.35,
        DB_NAME: 'vms_tactical_db',
        PENDING_STORE: 'wal_pending',
        SYNCED_STORE: 'wal_synced',
        TRACKS_STORE: 'saved_tracks',
        CAMERA_THROTTLE_MS: 2000,
        PLAYBACK_FRAME_MS: 80,
        CIRCULAR_BUFFER_SIZE: 5000,
        SEGMENT_SIZE: 500,
        MAX_UNSYNCED_POINTS: 8000
    };
    
    // DOM Elements
    let map, trailLine, currentMarker;
    let watchId = null;
    let isTracking = false;
    
    // Circular Buffer
    let trackBuffer = new Array(CONFIG.CIRCULAR_BUFFER_SIZE);
    let bufferStart = 0;
    let bufferLen = 0;
    let totalPoints = 0;
    let lastPosition = null;
    
    function pushPoint(point) {
        const pos = (bufferStart + bufferLen) % CONFIG.CIRCULAR_BUFFER_SIZE;
        trackBuffer[pos] = point;
        if(bufferLen < CONFIG.CIRCULAR_BUFFER_SIZE) {
            bufferLen++;
        } else {
            bufferStart = (bufferStart + 1) % CONFIG.CIRCULAR_BUFFER_SIZE;
        }
        totalPoints++;
        lastPosition = point;
        updateUI();
    }
    
    function getPoint(idx) {
        if(idx < 0 || idx >= bufferLen) return null;
        const pos = (bufferStart + idx) % CONFIG.CIRCULAR_BUFFER_SIZE;
        return trackBuffer[pos];
    }
    
    function getLastPoint() {
        if(bufferLen === 0) return null;
        const pos = (bufferStart + bufferLen - 1) % CONFIG.CIRCULAR_BUFFER_SIZE;
        return trackBuffer[pos];
    }
    
    function clearBuffer() {
        trackBuffer = new Array(CONFIG.CIRCULAR_BUFFER_SIZE);
        bufferStart = 0;
        bufferLen = 0;
        totalPoints = 0;
        lastPosition = null;
        if(trailLine) trailLine.setLatLngs([]);
        if(currentMarker && map) map.removeLayer(currentMarker);
        currentMarker = null;
        updateUI();
    }
    
    function getAllPoints() {
        const result = [];
        for(let i = 0; i < bufferLen; i++) {
            result.push(getPoint(i));
        }
        return result;
    }
    
    // Distance
    function haversine(lat1, lon1, lat2, lon2) {
        const R = 6371000;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI/180) * Math.cos(lat2 * Math.PI/180) *
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }
    
    function computeTotalDistance() {
        if(bufferLen < 2) return 0;
        let dist = 0;
        let prev = getPoint(0);
        for(let i = 1; i < bufferLen; i++) {
            const curr = getPoint(i);
            dist += haversine(prev.lat, prev.lng, curr.lat, curr.lng);
            prev = curr;
        }
        return dist;
    }
    
    // IndexedDB
    let db = null;
    let syncLock = false;
    
    function openDB() {
        return new Promise((resolve, reject) => {
            const req = indexedDB.open(CONFIG.DB_NAME, 3);
            req.onupgradeneeded = (e) => {
                const dbInst = e.target.result;
                if(!dbInst.objectStoreNames.contains(CONFIG.PENDING_STORE)) {
                    const store = dbInst.createObjectStore(CONFIG.PENDING_STORE, { keyPath: 'id', autoIncrement: true });
                    store.createIndex('synced', 'synced');
                }
                if(!dbInst.objectStoreNames.contains(CONFIG.SYNCED_STORE)) {
                    dbInst.createObjectStore(CONFIG.SYNCED_STORE, { keyPath: 'id', autoIncrement: true });
                }
                if(!dbInst.objectStoreNames.contains(CONFIG.TRACKS_STORE)) {
                    dbInst.createObjectStore(CONFIG.TRACKS_STORE, { keyPath: 'trackId' });
                }
            };
            req.onsuccess = () => { db = req.result; resolve(db); };
            req.onerror = reject;
        });
    }
    
    async function addToWAL(point) {
        if(!db) await openDB();
        const record = { ...point, synced: false, timestampMs: Date.now() };
        return new Promise((res, rej) => {
            const tx = db.transaction([CONFIG.PENDING_STORE], 'readwrite');
            tx.objectStore(CONFIG.PENDING_STORE).add(record);
            tx.oncomplete = () => res(true);
            tx.onerror = rej;
        });
    }
    
    async function getUnsyncedBatch(limit = 20) {
        if(!db) await openDB();
        return new Promise((resolve) => {
            const tx = db.transaction([CONFIG.PENDING_STORE], 'readonly');
            const index = tx.objectStore(CONFIG.PENDING_STORE).index('synced');
            const range = IDBKeyRange.only(false);
            const cursor = index.openCursor(range);
            const results = [];
            cursor.onsuccess = (e) => {
                const cur = e.target.result;
                if(cur && results.length < limit) {
                    results.push({ id: cur.primaryKey, ...cur.value });
                    cur.continue();
                } else resolve(results);
            };
        });
    }
    
    async function markSynced(ids) {
        if(!db) await openDB();
        const tx = db.transaction([CONFIG.PENDING_STORE, CONFIG.SYNCED_STORE], 'readwrite');
        const pending = tx.objectStore(CONFIG.PENDING_STORE);
        const synced = tx.objectStore(CONFIG.SYNCED_STORE);
        for(const id of ids) {
            const req = pending.get(id);
            req.onsuccess = () => {
                const data = req.result;
                if(data) {
                    data.synced = true;
                    data.syncedAt = Date.now();
                    synced.add(data);
                    pending.delete(id);
                }
            };
        }
        tx.oncomplete = () => {};
    }
    
    async function syncToServer() {
        if(syncLock) return;
        syncLock = true;
        updateSyncStatus('SYNCING', 'yellow');
        try {
            const pending = await getUnsyncedBatch(CONFIG.BATCH_SYNC);
            if(pending.length) {
                const batchId = Date.now() + '_' + Math.random().toString(36);
                const payload = pending.map(p => ({
                    lat: p.lat, lng: p.lng, alt: p.alt || 0,
                    accuracy: p.accuracy, timestamp: p.timestamp,
                    heading: p.heading, speed: p.speed
                }));
                const res = await fetch(CONFIG.SYNC_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ points: payload, deviceId: 'vms-android', batchId, version: '3.9' })
                });
                const result = await res.json();
                if(result && result.success === true) {
                    await markSynced(pending.map(p => p.id));
                    updateSyncStatus('ONLINE', 'green');
                    console.log(`[SYNC] Batch ${batchId} success, ${pending.length} points`);
                } else {
                    throw new Error('Sync failed');
                }
            } else {
                updateSyncStatus('IDLE', 'green');
            }
        } catch(e) {
            updateSyncStatus('ERROR', 'red');
            console.error(e);
        } finally {
            syncLock = false;
        }
    }
    
    async function recoverFromWAL() {
        if(!db) await openDB();
        const tx = db.transaction([CONFIG.PENDING_STORE], 'readonly');
        const index = tx.objectStore(CONFIG.PENDING_STORE).index('synced');
        const range = IDBKeyRange.only(false);
        const cursor = index.openCursor(range);
        let restored = 0;
        await new Promise((resolve) => {
            cursor.onsuccess = (e) => {
                const cur = e.target.result;
                if(cur && bufferLen < CONFIG.CIRCULAR_BUFFER_SIZE) {
                    const val = cur.value;
                    pushPoint({
                        lat: val.lat, lng: val.lng, alt: val.alt || 0,
                        accuracy: val.accuracy, timestamp: val.timestamp,
                        heading: val.heading, speed: val.speed
                    });
                    restored++;
                    cur.continue();
                } else resolve();
            };
        });
        if(restored > 0) {
            updateTrail();
            updateUI();
            console.log(`[RECOVERY] Restored ${restored} points from WAL`);
        }
    }
    
    // Trail rendering
    let lastRenderCount = 0;
    
    function updateTrail() {
        if(!trailLine) return;
        const latlngs = [];
        for(let i = 0; i < bufferLen; i++) {
            const p = getPoint(i);
            latlngs.push([p.lat, p.lng]);
        }
        trailLine.setLatLngs(latlngs);
        if(bufferLen > 0) {
            const last = getLastPoint();
            if(!currentMarker) {
                currentMarker = L.circleMarker([last.lat, last.lng], {
                    radius: 11, fillColor: '#ff5a5f', color: '#fff', weight: 2
                }).addTo(map);
            } else {
                currentMarker.setLatLng([last.lat, last.lng]);
            }
        }
        if(currentTab === '3D') draw3D();
    }
    
    // 3D Canvas
    let canvas3D, ctx3D;
    let last3DHash = '';
    
    function init3D() {
        canvas3D = document.getElementById('canvas3D');
        ctx3D = canvas3D.getContext('2d');
        window.addEventListener('resize', () => { resize3D(); if(currentTab === '3D') draw3D(); });
        resize3D();
    }
    
    function resize3D() {
        if(canvas3D) {
            canvas3D.width = window.innerWidth;
            canvas3D.height = window.innerHeight;
        }
    }
    
    function draw3D() {
        if(!ctx3D || bufferLen < 2) {
            if(ctx3D) {
                ctx3D.clearRect(0, 0, canvas3D.width, canvas3D.height);
                ctx3D.fillStyle = '#aaa';
                ctx3D.fillText("Menunggu data GPS...", 30, 80);
            }
            return;
        }
        const hash = bufferLen + '_' + (getLastPoint()?.lat || 0);
        if(hash === last3DHash) return;
        last3DHash = hash;
        
        ctx3D.clearRect(0, 0, canvas3D.width, canvas3D.height);
        let minAlt = Infinity, maxAlt = -Infinity;
        for(let i = 0; i < bufferLen; i++) {
            const p = getPoint(i);
            minAlt = Math.min(minAlt, p.alt || 0);
            maxAlt = Math.max(maxAlt, p.alt || 0);
        }
        const altRange = Math.max(maxAlt - minAlt, 1);
        const margin = 50;
        const w = canvas3D.width - margin * 2;
        const h = canvas3D.height - margin * 2;
        
        ctx3D.fillStyle = '#0f172a';
        ctx3D.fillRect(0, 0, canvas3D.width, canvas3D.height);
        
        ctx3D.strokeStyle = '#2a3f6e';
        ctx3D.lineWidth = 0.5;
        for(let i = 0; i <= 5; i++) {
            let x = margin + (w * i / 5);
            ctx3D.beginPath();
            ctx3D.moveTo(x, margin);
            ctx3D.lineTo(x, margin + h);
            ctx3D.stroke();
            let y = margin + (h * i / 5);
            ctx3D.beginPath();
            ctx3D.moveTo(margin, y);
            ctx3D.lineTo(margin + w, y);
            ctx3D.stroke();
        }
        
        const first = getPoint(0);
        const last = getPoint(bufferLen - 1);
        const latSpan = Math.abs(last.lat - first.lat) + 0.00001;
        const lngSpan = Math.abs(last.lng - first.lng) + 0.00001;
        
        ctx3D.beginPath();
        ctx3D.strokeStyle = '#3bc0fc';
        ctx3D.lineWidth = 2.5;
        const step = Math.max(1, Math.floor(bufferLen / 500));
        for(let i = 0; i < bufferLen; i += step) {
            const p = getPoint(i);
            let x = margin + ((p.lng - first.lng) / lngSpan) * w;
            let y = margin + ((first.lat - p.lat) / latSpan) * h;
            let altOff = ((p.alt - minAlt) / altRange) * 35;
            y -= altOff;
            if(i === 0) ctx3D.moveTo(x, y);
            else ctx3D.lineTo(x, y);
        }
        ctx3D.stroke();
        
        for(let i = 0; i < bufferLen; i += step) {
            const p = getPoint(i);
            let x = margin + ((p.lng - first.lng) / lngSpan) * w;
            let y = margin + ((first.lat - p.lat) / latSpan) * h;
            let altOff = ((p.alt - minAlt) / altRange) * 35;
            y -= altOff;
            ctx3D.fillStyle = i === bufferLen-1 ? '#ff7760' : '#22ddbb';
            ctx3D.beginPath();
            ctx3D.arc(x, y, i === bufferLen-1 ? 5 : 3, 0, Math.PI*2);
            ctx3D.fill();
        }
    }
    
    // GPS Filtering
    let lastValidCoord = null;
    
    function isPointValid(lat, lng, accuracy, timestamp) {
        if(accuracy && accuracy > CONFIG.MIN_ACCURACY_METERS) return false;
        if(!lastValidCoord) return true;
        const dt = (timestamp - lastValidCoord.t) / 1000;
        if(dt < 0.1) return false;
        const dist = haversine(lastValidCoord.lat, lastValidCoord.lng, lat, lng);
        if(dist > CONFIG.MAX_JUMP_METERS) return false;
        const speed = dist / dt;
        if(speed > CONFIG.MAX_SPEED_MS) return false;
        return true;
    }
    
    function smoothPoint(newLat, newLng) {
        if(!lastPosition) return { lat: newLat, lng: newLng };
        const f = CONFIG.SMOOTHING_FACTOR;
        return {
            lat: lastPosition.lat * (1-f) + newLat * f,
            lng: lastPosition.lng * (1-f) + newLng * f
        };
    }
    
    let lastCenterTime = 0;
    
    async function addPoint(lat, lng, accuracy, heading, speed, altitude, timestamp) {
        const smoothed = smoothPoint(lat, lng);
        const point = {
            lat: smoothed.lat, lng: smoothed.lng, alt: altitude || 0,
            accuracy: accuracy || 0, heading: heading || 0,
            speed: speed || 0, timestamp: timestamp || Date.now()
        };
        const last = getLastPoint();
        if(last && haversine(last.lat, last.lng, point.lat, point.lng) < 0.8) return;
        
        pushPoint(point);
        await addToWAL(point);
        updateTrail();
        
        if(isTracking && map && currentTab === '2D') {
            const now = Date.now();
            if(now - lastCenterTime >= CONFIG.CAMERA_THROTTLE_MS) {
                map.setView([lat, lng], map.getZoom());
                lastCenterTime = now;
            }
        }
        if(currentTab === '3D') draw3D();
    }
    
    function onGPSPosition(pos) {
        const { latitude, longitude, accuracy, heading, speed, altitude } = pos.coords;
        const now = Date.now();
        if(!isPointValid(latitude, longitude, accuracy, now)) {
            document.getElementById('accuracyText').innerHTML = `${Math.round(accuracy)}m (reject)`;
            return;
        }
        lastValidCoord = { lat: latitude, lng: longitude, t: now };
        updateGPSStatus('TRACKING', 'green', accuracy);
        addPoint(latitude, longitude, accuracy, heading, speed, altitude, now);
    }
    
    function onGPSError(err) {
        let msg = err.code === 1 ? 'DENIED' : (err.code === 2 ? 'SIGNAL WEAK' : 'TIMEOUT');
        updateGPSStatus(msg, 'red', null);
    }
    
    // UI Updates
    function updateGPSStatus(status, ledColor, accuracy) {
        const led = document.getElementById('gpsLed');
        led.className = 'led';
        led.classList.add(ledColor === 'green' ? 'led-green' : (ledColor === 'red' ? 'led-red' : 'led-yellow'));
        document.getElementById('gpsText').innerText = `GPS: ${status}`;
        if(accuracy) document.getElementById('accuracyText').innerHTML = `${Math.round(accuracy)}m`;
    }
    
    function updateSyncStatus(status, ledColor) {
        const led = document.getElementById('syncLed');
        led.className = 'led';
        led.classList.add(ledColor === 'green' ? 'led-green' : (ledColor === 'red' ? 'led-red' : 'led-yellow'));
        document.getElementById('syncText').innerText = `Sync: ${status}`;
    }
    
    function updateUI() {
        document.getElementById('pointCounter').innerText = totalPoints;
        document.getElementById('statsBox').innerHTML = `Points:${totalPoints} | Saved:${savedTracks.length}`;
        if(lastPosition && lastPosition.alt !== undefined) {
            document.getElementById('altText').innerHTML = `${Math.round(lastPosition.alt)}m`;
        }
    }
    
    // Map
    function initMap() {
        map = L.map('map', { preferCanvas: true }).setView([-6.2088, 106.8456], 15);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '© OSM',
            subdomains: 'abcd'
        }).addTo(map);
        trailLine = L.polyline([], { color: '#1e88e5', weight: 4, smoothFactor: 2 }).addTo(map);
        if(navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(pos => {
                map.setView([pos.coords.latitude, pos.coords.longitude], 16);
            }, null, { timeout: 4000 });
        }
    }
    
    function centerMap() {
        if(lastPosition && map && currentTab === '2D') {
            map.setView([lastPosition.lat, lastPosition.lng], 18);
            lastCenterTime = Date.now();
        }
    }
    
    // Tracking Control
    function startTracking() {
        if(isTracking) return;
        if(!navigator.geolocation) { alert("GPS not supported"); return; }
        watchId = navigator.geolocation.watchPosition(onGPSPosition, onGPSError, CONFIG.GPS_OPTIONS);
        isTracking = true;
        document.getElementById('startBtn').style.display = 'none';
        document.getElementById('stopBtn').style.display = 'inline-block';
        updateGPSStatus('ACTIVE', 'green', null);
    }
    
    function stopTracking() {
        if(watchId) {
            navigator.geolocation.clearWatch(watchId);
            watchId = null;
        }
        isTracking = false;
        document.getElementById('startBtn').style.display = 'inline-block';
        document.getElementById('stopBtn').style.display = 'none';
        updateGPSStatus('STOP', 'red', null);
    }
    
    // Save/Load Tracks
    let savedTracks = [];
    
    async function saveCurrentTrack() {
        if(bufferLen === 0) { alert("Tidak ada titik"); return; }
        const name = prompt("Nama track:", `Track ${new Date().toLocaleString()}`);
        if(!name) return;
        const distance = computeTotalDistance();
        const trackId = Date.now() + '_' + Math.random().toString(36);
        const points = getAllPoints();
        const trackData = {
            trackId, name, date: Date.now(), dateStr: new Date().toLocaleString(),
            totalPoints: bufferLen, distance, points
        };
        if(!db) await openDB();
        const tx = db.transaction([CONFIG.TRACKS_STORE], 'readwrite');
        tx.objectStore(CONFIG.TRACKS_STORE).add(trackData);
        savedTracks.unshift({ trackId, name, dateStr: trackData.dateStr, totalPoints: bufferLen, distance });
        if(savedTracks.length > 25) savedTracks.pop();
        updateHistoryList();
        updateUI();
        alert(`✅ Track "${name}" tersimpan (${distance.toFixed(0)}m)`);
    }
    
    function updateHistoryList() {
        const container = document.getElementById('historyList');
        if(savedTracks.length === 0) {
            container.innerHTML = '<div>Belum ada track tersimpan</div>';
            return;
        }
        container.innerHTML = savedTracks.map(t => `
            <div class="history-item" onclick="window.loadTrack('${t.trackId}')">
                <div>📌 ${escapeHtml(t.name)}</div>
                <div>📅 ${t.dateStr} | ${t.totalPoints} titik | 🧭 ${t.distance.toFixed(0)} m</div>
                <div style="color:#ff8a7a;" onclick="event.stopPropagation();window.deleteTrack('${t.trackId}')">🗑 Hapus</div>
            </div>
        `).join('');
    }
    
    window.loadTrack = async (trackId) => {
        if(!db) await openDB();
        const tx = db.transaction([CONFIG.TRACKS_STORE], 'readonly');
        const req = tx.objectStore(CONFIG.TRACKS_STORE).get(trackId);
        req.onsuccess = () => {
            const track = req.result;
            if(track && confirm(`Muat track "${track.name}"? Data saat ini akan diganti.`)) {
                clearBuffer();
                for(const p of track.points) pushPoint(p);
                updateTrail();
                if(map && lastPosition) map.setView([lastPosition.lat, lastPosition.lng], 16);
                if(currentTab === '3D') draw3D();
                document.getElementById('historyPanel').classList.remove('show');
            }
        };
    };
    
    window.deleteTrack = async (trackId) => {
        if(confirm("Hapus track ini?")) {
            savedTracks = savedTracks.filter(t => t.trackId !== trackId);
            if(!db) await openDB();
            const tx = db.transaction([CONFIG.TRACKS_STORE], 'readwrite');
            tx.objectStore(CONFIG.TRACKS_STORE).delete(trackId);
            updateHistoryList();
            updateUI();
        }
    };
    
    async function loadSavedTracks() {
        if(!db) await openDB();
        const tx = db.transaction([CONFIG.TRACKS_STORE], 'readonly');
        const store = tx.objectStore(CONFIG.TRACKS_STORE);
        const tracks = [];
        await new Promise(r => {
            store.openCursor().onsuccess = (e) => {
                const cur = e.target.result;
                if(cur) {
                    const { points, ...meta } = cur.value;
                    tracks.push(meta);
                    cur.continue();
                } else r();
            };
        });
        if(tracks.length) {
            savedTracks = tracks.sort((a,b) => b.date - a.date);
            updateHistoryList();
        }
    }
    
    // Backtrack Mode
    let returnMode = false;
    let returnInterval = null;
    let returnLine = null;
    
    function toggleReturnMode() {
        if(bufferLen === 0) { alert("Tidak ada jalur untuk kembali"); return; }
        returnMode = !returnMode;
        const btn = document.getElementById('returnBtn');
        const info = document.getElementById('breadcrumbInfo');
        if(returnMode) {
            btn.innerHTML = '📍 RETURN ON';
            btn.style.background = '#2c6e2f';
            info.classList.add('show');
            if(returnInterval) clearInterval(returnInterval);
            returnInterval = setInterval(updateReturnDistance, 1500);
            updateReturnDistance();
            if(returnLine && map) map.removeLayer(returnLine);
            const start = getPoint(0);
            const now = getLastPoint();
            returnLine = L.polyline([[now.lat, now.lng], [start.lat, start.lng]], {
                color: '#fd7e2c', weight: 3, dashArray: '8,8'
            }).addTo(map);
        } else {
            btn.innerHTML = '🏠 RETURN';
            btn.style.background = '#fd7e2c';
            info.classList.remove('show');
            if(returnInterval) clearInterval(returnInterval);
            if(returnLine && map) map.removeLayer(returnLine);
            returnLine = null;
        }
    }
    
    function updateReturnDistance() {
        if(!returnMode || bufferLen < 1) return;
        const dist = computeTotalDistance();
        document.getElementById('returnDistance').innerHTML = `${Math.round(dist)} meter (true path)`;
    }
    
    // Playback Engine
    let playbackActive = false;
    let playbackTimer = null;
    let playbackPoints = [];
    let playbackIndex = 0;
    let playbackMarker = null;
    let isPlaying = false;
    
    function stopPlayback() {
        if(playbackTimer) cancelAnimationFrame(playbackTimer);
        playbackActive = false;
        isPlaying = false;
        if(playbackMarker && map) map.removeLayer(playbackMarker);
        playbackMarker = null;
        document.getElementById('playbackBar').classList.remove('show');
    }
    
    function startPlayback() {
        if(bufferLen < 2) { alert("Tidak ada titik untuk replay"); return; }
        stopPlayback();
        const maxPoints = 2000;
        const step = Math.max(1, Math.ceil(bufferLen / maxPoints));
        playbackPoints = [];
        for(let i = 0; i < bufferLen; i += step) playbackPoints.push(getPoint(i));
        const last = getLastPoint();
        if(playbackPoints[playbackPoints.length-1] !== last) playbackPoints.push(last);
        
        playbackIndex = 0;
        playbackActive = true;
        isPlaying = true;
        
        const bar = document.getElementById('playbackBar');
        bar.classList.add('show');
        const slider = document.getElementById('playbackSlider');
        slider.max = playbackPoints.length - 1;
        slider.value = 0;
        document.getElementById('playbackPercent').innerText = "0%";
        
        if(!playbackMarker) {
            playbackMarker = L.circleMarker([playbackPoints[0].lat, playbackPoints[0].lng], {
                radius: 8, color: '#f1c40f', fillColor: '#f39c12', weight: 3
            }).addTo(map);
        }
        
        let lastFrame = 0;
        function animate(now) {
            if(!playbackActive || !isPlaying) return;
            if(now - lastFrame >= CONFIG.PLAYBACK_FRAME_MS) {
                lastFrame = now;
                if(playbackIndex < playbackPoints.length) {
                    const p = playbackPoints[playbackIndex];
                    playbackMarker.setLatLng([p.lat, p.lng]);
                    if(map && currentTab === '2D') {
                        map.setView([p.lat, p.lng], map.getZoom());
                    }
                    document.getElementById('playbackSlider').value = playbackIndex;
                    document.getElementById('playbackPercent').innerText = Math.round((playbackIndex / playbackPoints.length) * 100) + "%";
                    playbackIndex++;
                    playbackTimer = requestAnimationFrame(animate);
                } else {
                    stopPlayback();
                    alert("Replay selesai");
                }
            } else {
                playbackTimer = requestAnimationFrame(animate);
            }
        }
        playbackTimer = requestAnimationFrame(animate);
    }
    
    function pausePlayback() { isPlaying = false; if(playbackTimer) cancelAnimationFrame(playbackTimer); }
    function resumePlayback() {
        if(playbackActive && !isPlaying && playbackIndex < playbackPoints.length) {
            isPlaying = true;
            let lastFrame = 0;
            function animate(now) {
                if(!playbackActive || !isPlaying) return;
                if(now - lastFrame >= CONFIG.PLAYBACK_FRAME_MS) {
                    lastFrame = now;
                    if(playbackIndex < playbackPoints.length) {
                        const p = playbackPoints[playbackIndex];
                        playbackMarker.setLatLng([p.lat, p.lng]);
                        if(map && currentTab === '2D') map.setView([p.lat, p.lng], map.getZoom());
                        document.getElementById('playbackSlider').value = playbackIndex;
                        document.getElementById('playbackPercent').innerText = Math.round((playbackIndex / playbackPoints.length) * 100) + "%";
                        playbackIndex++;
                        playbackTimer = requestAnimationFrame(animate);
                    } else stopPlayback();
                } else { playbackTimer = requestAnimationFrame(animate); }
            }
            playbackTimer = requestAnimationFrame(animate);
        }
    }
    
    // Worker for auto sync
    let syncWorker = null;
    let workerBlobUrl = null;
    
    function initWorker() {
        if(syncWorker) { syncWorker.terminate(); syncWorker = null; }
        if(workerBlobUrl) { URL.revokeObjectURL(workerBlobUrl); workerBlobUrl = null; }
        const blob = new Blob([`
            let interval;
            let active = true;
            self.onmessage = (e) => {
                if(e.data.type === 'START') {
                    if(interval) clearInterval(interval);
                    interval = setInterval(() => {
                        if(active) self.postMessage({type: 'SYNC'});
                    }, ${CONFIG.AUTO_SYNC_INTERVAL_MS});
                } else if(e.data.type === 'VISIBILITY') {
                    active = e.data.visible;
                }
            };
        `], { type: 'application/javascript' });
        workerBlobUrl = URL.createObjectURL(blob);
        syncWorker = new Worker(workerBlobUrl);
        syncWorker.onmessage = () => { syncToServer(); };
        syncWorker.postMessage({ type: 'START' });
    }
    
    // Tab switching
    let currentTab = '2D';
    
    function switchTab(tab) {
        currentTab = tab;
        const mapDiv = document.getElementById('map');
        const canvasDiv = document.getElementById('canvas3D');
        const btn2D = document.getElementById('btn2D');
        const btn3D = document.getElementById('btn3D');
        if(tab === '2D') {
            mapDiv.style.display = 'block';
            canvasDiv.style.display = 'none';
            btn2D.classList.add('active');
            btn3D.classList.remove('active');
            if(map) map.invalidateSize();
        } else {
            mapDiv.style.display = 'none';
            canvasDiv.style.display = 'block';
            btn2D.classList.remove('active');
            btn3D.classList.add('active');
            resize3D();
            draw3D();
        }
    }
    
    function clearAll() {
        if(confirm("Hapus semua titik tracking? Data tersimpan tetap ada.")) {
            clearBuffer();
            updateTrail();
            updateUI();
            if(currentTab === '3D') draw3D();
            updateGPSStatus('CLEARED', 'red', null);
        }
    }
    
    function openSheet() {
        window.open('https://docs.google.com/spreadsheets/d/1IlKDIHpMdA7FJwLFEpJP-V4iDnAXnpE9YKFJRkGZ6uI/edit', '_blank');
    }
    
    function toggleHistory() {
        document.getElementById('historyPanel').classList.toggle('show');
    }
    
    function escapeHtml(str) {
        if(!str) return '';
        return str.replace(/[&<>]/g, (m) => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;'));
    }
    
    // Lifecycle
    window.addEventListener('pagehide', () => {
        if(watchId) navigator.geolocation.clearWatch(watchId);
        if(syncWorker) syncWorker.terminate();
    });
    
    document.addEventListener('visibilitychange', () => {
        if(document.visibilityState === 'visible') {
            if(syncWorker) { syncWorker.terminate(); syncWorker = null; }
            initWorker();
        }
    });
    
    // Bootstrap
    async function bootstrap() {
        console.log("VMS v3.9 - Tactical Tracker Pro");
        await openDB();
        await recoverFromWAL();
        initMap();
        init3D();
        await loadSavedTracks();
        initWorker();
        
        document.getElementById('startBtn').onclick = startTracking;
        document.getElementById('stopBtn').onclick = stopTracking;
        document.getElementById('syncBtn').onclick = () => syncToServer();
        document.getElementById('clearBtn').onclick = clearAll;
        document.getElementById('centerBtn').onclick = centerMap;
        document.getElementById('saveBtn').onclick = saveCurrentTrack;
        document.getElementById('historyBtn').onclick = toggleHistory;
        document.getElementById('returnBtn').onclick = toggleReturnMode;
        document.getElementById('sheetBtn').onclick = openSheet;
        document.getElementById('btn2D').onclick = () => switchTab('2D');
        document.getElementById('btn3D').onclick = () => switchTab('3D');
        document.getElementById('playbackToggleBtn').onclick = () => {
            if(playbackActive) stopPlayback();
            else startPlayback();
        };
        document.getElementById('playPauseBtn')?.addEventListener('click', () => {
            if(!playbackActive) return;
            if(isPlaying) pausePlayback();
            else resumePlayback();
        });
        document.getElementById('stopPlaybackBtn')?.addEventListener('click', () => stopPlayback());
        document.getElementById('playbackSlider')?.addEventListener('input', (e) => {
            if(!playbackActive) return;
            const idx = parseInt(e.target.value);
            if(idx >= 0 && idx < playbackPoints.length) {
                playbackIndex = idx;
                const p = playbackPoints[playbackIndex];
                playbackMarker.setLatLng([p.lat, p.lng]);
                map.setView([p.lat, p.lng], map.getZoom());
                document.getElementById('playbackPercent').innerText = Math.round((idx / playbackPoints.length) * 100) + "%";
                if(isPlaying) pausePlayback();
            }
        });
        
        updateGPSStatus('READY', 'yellow', null);
        updateSyncStatus('STANDBY', 'yellow');
        updateUI();
        
        console.log("System ready - waiting for GPS");
    }
    
    bootstrap();
})();
</script>
