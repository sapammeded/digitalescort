<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SUPER TRACKING — AR + Live Polyline + Waypoint + Voice</title>
  <meta name="description" content="Super Tracking: Kamera AR, Live Polyline, Waypoint, Voice, Export GPX">
  <meta name="theme-color" content="#1e40af">
  
  <!-- Leaflet CSS (untuk map) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #000;
      height: 100vh;
      overflow: hidden;
      position: fixed;
      width: 100%;
    }

    /* App container */
    .app {
      height: 100vh;
      width: 100%;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      background: linear-gradient(135deg, rgba(0,0,0,0.7), rgba(0,0,0,0.5));
      backdrop-filter: blur(12px);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .app-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: bold;
      color: white;
      font-size: 16px;
    }

    .status-badge {
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(0,0,0,0.5);
      font-size: 11px;
      color: #10b981;
    }

    /* Camera view (fullscreen) */
    .camera-container {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #000;
      z-index: 1;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* AR Canvas overlay */
    #arCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    /* Info Panel (atas kamera) */
    .info-panel {
      position: absolute;
      top: 70px;
      left: 12px;
      right: 12px;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 12px;
      z-index: 20;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .location-name {
      font-weight: 700;
      color: white;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .coords-text {
      font-size: 11px;
      color: #94a3b8;
      font-family: monospace;
    }

    .stats-row {
      display: flex;
      gap: 12px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .stat-card {
      background: rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 6px 12px;
      text-align: center;
      min-width: 70px;
    }

    .stat-label {
      font-size: 9px;
      color: #94a3b8;
    }

    .stat-value {
      font-size: 16px;
      font-weight: bold;
      color: white;
    }

    /* Button panel */
    .button-panel {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 30;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(12px);
      padding: 10px 16px;
      border-radius: 50px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: none;
      font-size: 24px;
      cursor: pointer;
      transition: all 0.2s;
      background: rgba(255,255,255,0.1);
      color: white;
    }

    .btn-primary {
      background: #1e40af;
      box-shadow: 0 0 15px rgba(30,64,175,0.5);
    }

    .btn-danger {
      background: #dc2626;
    }

    .btn-success {
      background: #10b981;
    }

    .btn:active {
      transform: scale(0.94);
    }

    /* Mini Map (bisa di-toggle) */
    .mini-map-container {
      position: absolute;
      bottom: 100px;
      right: 12px;
      width: 160px;
      height: 160px;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid rgba(255,255,255,0.2);
      z-index: 25;
      background: #1a1a2e;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      transition: all 0.3s;
    }

    .mini-map-container.hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.8);
    }

    #miniMap {
      width: 100%;
      height: 100%;
    }

    /* Waypoint list */
    .waypoint-list {
      position: absolute;
      bottom: 100px;
      left: 12px;
      right: 90px;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 8px;
      max-height: 150px;
      overflow-y: auto;
      z-index: 25;
      display: none;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .waypoint-list.show {
      display: block;
    }

    .wp-item {
      padding: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .wp-name {
      color: white;
      font-weight: 500;
      font-size: 13px;
    }

    .wp-dist {
      color: #10b981;
      font-size: 11px;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #1e293b;
      color: white;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 13px;
      z-index: 200;
      transition: transform 0.3s;
      white-space: nowrap;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    /* Loading screen */
    .loading-screen {
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg, #0f172a, #020617);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      z-index: 1000;
      color: white;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Tombol toggle tambahan */
    .extra-buttons {
      position: absolute;
      top: 70px;
      right: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 20;
    }

    .extra-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.1);
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    /* Voice indicator */
    .voice-indicator {
      position: absolute;
      top: 70px;
      left: 12px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.2); }
    }
  </style>
</head>
<body>

<div class="app" id="app">
  <!-- Header -->
  <div class="header">
    <div class="app-title">
      <span>🎯</span>
      <span>SUPER TRACKING</span>
    </div>
    <div style="display: flex; gap: 8px;">
      <div class="status-badge" id="gpsStatus">📍 -</div>
      <div class="status-badge" id="recordStatus">⚪ STOP</div>
    </div>
  </div>

  <!-- Camera + AR -->
  <div class="camera-container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="arCanvas"></canvas>
  </div>

  <!-- Info Panel -->
  <div class="info-panel" id="infoPanel">
    <div class="location-name" id="locationName">Memulai...</div>
    <div class="coords-text" id="coords">Lat: -- , Lng: --</div>
    <div class="stats-row" id="statsRow">
      <div class="stat-card">
        <div class="stat-label">TITIK</div>
        <div class="stat-value" id="pointCount">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">JARAK</div>
        <div class="stat-value" id="distance">0 m</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">KECEPATAN</div>
        <div class="stat-value" id="speed">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">DURASI</div>
        <div class="stat-value" id="duration">0:00</div>
      </div>
    </div>
  </div>

  <!-- Extra buttons -->
  <div class="extra-buttons">
    <button class="extra-btn" id="btnToggleMap" title="Toggle Map">🗺️</button>
    <button class="extra-btn" id="btnToggleWaypoint" title="Waypoint List">📌</button>
    <button class="extra-btn" id="btnVoice" title="Voice ON/OFF">🔊</button>
  </div>

  <!-- Main buttons -->
  <div class="button-panel">
    <button class="btn" id="btnWaypoint" title="Simpan Waypoint">📍</button>
    <button class="btn btn-success" id="btnStartTrack" title="Mulai Tracking">▶</button>
    <button class="btn btn-danger" id="btnStopTrack" title="Stop Tracking" disabled>⏹</button>
    <button class="btn" id="btnExport" title="Export GPX">📤</button>
    <button class="btn" id="btnReset" title="Reset">🗑</button>
  </div>

  <!-- Mini Map -->
  <div class="mini-map-container" id="miniMapContainer">
    <div id="miniMap"></div>
  </div>

  <!-- Waypoint List -->
  <div class="waypoint-list" id="waypointList"></div>

  <!-- Toast -->
  <div class="toast" id="toast">✅ Siap</div>

  <!-- Loading -->
  <div class="loading-screen" id="loadingScreen">
    <div class="spinner"></div>
    <div>Memulai SUPER TRACKING...</div>
    <div class="coords-text" id="loadingStatus">Meminta izin kamera & GPS</div>
  </div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
// ==================== SUPER TRACKING - FULL VERSION ====================
// Gabungan: AR Camera + Live Polyline + Waypoint + Voice + Export GPX

// ---------- DOM Elements ----------
const $ = id => document.getElementById(id);
const showToast = (msg, duration = 2500) => {
  const toast = $('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), duration);
};

// ---------- State ----------
const state = {
  // Camera
  stream: null,
  usingFront: false,
  
  // GPS
  watchId: null,
  lastPos: null,
  startTime: null,
  
  // Path tracking (LIVE POLYLINE)
  points: [],
  totalDistance: 0,
  isTracking: false,
  
  // Map
  map: null,
  polyline: null,
  currentMarker: null,
  mapVisible: true,
  
  // Waypoint
  waypoints: [],
  
  // Voice
  voiceOn: false,
  
  // AR Canvas
  arCtx: null,
  animationId: null,
  
  // Reverse geocode cache
  rgCache: {}
};

// ---------- Utility Functions ----------
function formatDistance(meters) {
  if (meters < 1000) return `${Math.round(meters)} m`;
  return `${(meters / 1000).toFixed(2)} km`;
}

function formatSpeed(mps) {
  if (!mps || mps <= 0) return '0';
  return `${(mps * 3.6).toFixed(1)}`;
}

function formatDuration(ms) {
  if (!ms) return '0:00';
  const seconds = Math.floor(ms / 1000);
  const mins = Math.floor(seconds / 60);
  const secs = seconds % 60;
  return `${mins}:${secs.toString().padStart(2, '0')}`;
}

function updateDurationUI() {
  if (state.startTime && state.isTracking) {
    const duration = Date.now() - state.startTime;
    $('duration').textContent = formatDuration(duration);
  }
}

// Update interval untuk durasi
setInterval(() => {
  if (state.isTracking && state.startTime) {
    $('duration').textContent = formatDuration(Date.now() - state.startTime);
  }
}, 1000);

// Haversine distance
function haversineDistance(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const φ1 = lat1 * Math.PI / 180;
  const φ2 = lat2 * Math.PI / 180;
  const Δφ = (lat2 - lat1) * Math.PI / 180;
  const Δλ = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
            Math.cos(φ1) * Math.cos(φ2) *
            Math.sin(Δλ/2) * Math.sin(Δλ/2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R * c;
}

// ---------- Map Functions (Leaflet + Polyline) ----------
function initMap() {
  const mapContainer = $('miniMap');
  if (!mapContainer) return;
  
  state.map = L.map('miniMap').setView([-6.2088, 106.8456], 15);
  
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org">OSM</a>',
    subdomains: 'abcd',
    maxZoom: 19
  }).addTo(state.map);
}

function updatePolyline() {
  if (!state.map) return;
  
  // Remove old polyline
  if (state.polyline) {
    state.map.removeLayer(state.polyline);
  }
  
  // Remove old marker
  if (state.currentMarker) {
    state.map.removeLayer(state.currentMarker);
  }
  
  // Draw new polyline if points exist
  if (state.points.length >= 2) {
    const latlngs = state.points.map(p => [p.lat, p.lng]);
    state.polyline = L.polyline(latlngs, {
      color: '#3b82f6',
      weight: 4,
      opacity: 0.9,
      lineJoin: 'round'
    }).addTo(state.map);
    
    // Auto fit bounds
    state.map.fitBounds(state.polyline.getBounds(), { padding: [20, 20] });
  }
  
  // Add current position marker
  if (state.lastPos) {
    state.currentMarker = L.marker([state.lastPos.coords.latitude, state.lastPos.coords.longitude], {
      icon: L.divIcon({
        html: '<div style="background:#10b981; width:12px; height:12px; border-radius:50%; border:2px solid white; box-shadow:0 0 10px #10b981;"></div>',
        iconSize: [12, 12],
        className: 'custom-marker'
      })
    }).addTo(state.map);
  }
}

function updateMapCenter() {
  if (state.map && state.lastPos) {
    state.map.setView([state.lastPos.coords.latitude, state.lastPos.coords.longitude], 16);
  }
}

// Update map setiap 1.5 detik
setInterval(() => {
  if (state.map && state.lastPos && state.mapVisible) {
    updateMapCenter();
    updatePolyline();
  }
}, 1500);

// Toggle map visibility
$('btnToggleMap').addEventListener('click', () => {
  state.mapVisible = !state.mapVisible;
  const container = $('miniMapContainer');
  if (state.mapVisible) {
    container.classList.remove('hidden');
    setTimeout(() => state.map?.invalidateSize(), 200);
  } else {
    container.classList.add('hidden');
  }
});

// ---------- Camera + AR ----------
async function startCamera(facing = 'environment') {
  if (!navigator.mediaDevices) throw new Error('Camera tidak tersedia');
  
  if (state.stream) {
    state.stream.getTracks().forEach(t => t.stop());
  }
  
  const constraints = {
    video: { facingMode: { exact: facing }, width: { ideal: 1280 }, height: { ideal: 720 } }
  };
  
  try {
    state.stream = await navigator.mediaDevices.getUserMedia(constraints);
  } catch (e) {
    // Fallback tanpa exact
    const fallbackConstraints = { video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } } };
    state.stream = await navigator.mediaDevices.getUserMedia(fallbackConstraints);
  }
  
  const video = $('video');
  video.srcObject = state.stream;
  state.usingFront = (facing === 'user');
}

function stopCamera() {
  if (state.stream) {
    state.stream.getTracks().forEach(t => t.stop());
    state.stream = null;
  }
}

// AR Canvas setup
function initARCanvas() {
  const canvas = $('arCanvas');
  const ctx = canvas.getContext('2d');
  state.arCtx = ctx;
  
  function resize() {
    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;
  }
  resize();
  window.addEventListener('resize', resize);
  
  function draw() {
    if (!state.arCtx) return;
    const canvas = $('arCanvas');
    const video = $('video');
    
    if (canvas.width !== canvas.offsetWidth || canvas.height !== canvas.offsetHeight) {
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
    }
    
    state.arCtx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Draw reticle di tengah
    state.arCtx.beginPath();
    state.arCtx.arc(canvas.width / 2, canvas.height / 2, 20, 0, Math.PI * 2);
    state.arCtx.strokeStyle = 'rgba(255,255,255,0.5)';
    state.arCtx.lineWidth = 2;
    state.arCtx.stroke();
    
    // Draw crosshair
    state.arCtx.beginPath();
    state.arCtx.moveTo(canvas.width / 2 - 30, canvas.height / 2);
    state.arCtx.lineTo(canvas.width / 2 - 10, canvas.height / 2);
    state.arCtx.moveTo(canvas.width / 2 + 10, canvas.height / 2);
    state.arCtx.lineTo(canvas.width / 2 + 30, canvas.height / 2);
    state.arCtx.moveTo(canvas.width / 2, canvas.height / 2 - 30);
    state.arCtx.lineTo(canvas.width / 2, canvas.height / 2 - 10);
    state.arCtx.moveTo(canvas.width / 2, canvas.height / 2 + 10);
    state.arCtx.lineTo(canvas.width / 2, canvas.height / 2 + 30);
    state.arCtx.stroke();
    
    // Draw waypoints di AR (jika ada)
    if (state.lastPos && state.waypoints.length > 0) {
      state.waypoints.forEach(wp => {
        const screenPos = gpsToScreen(wp.lat, wp.lon);
        if (screenPos.x > 0 && screenPos.x < canvas.width && screenPos.y > 0 && screenPos.y < canvas.height) {
          state.arCtx.beginPath();
          state.arCtx.arc(screenPos.x, screenPos.y, 12, 0, Math.PI * 2);
          state.arCtx.fillStyle = 'rgba(16, 185, 129, 0.8)';
          state.arCtx.fill();
          state.arCtx.fillStyle = 'white';
          state.arCtx.font = '12px sans-serif';
          state.arCtx.fillText(wp.name, screenPos.x + 15, screenPos.y + 5);
        }
      });
    }
    
    state.animationId = requestAnimationFrame(draw);
  }
  
  draw();
}

function gpsToScreen(lat, lon) {
  if (!state.lastPos) return { x: -1, y: -1 };
  const canvas = $('arCanvas');
  const midLat = state.lastPos.coords.latitude;
  const midLon = state.lastPos.coords.longitude;
  
  // Skala kasar
  const scale = 1000000;
  const x = (lon - midLon) * scale + canvas.width / 2;
  const y = (lat - midLat) * scale + canvas.height / 2;
  return { x, y };
}

// ---------- GPS + Path Recording (LIVE POLYLINE) ----------
function startGPS() {
  if (!navigator.geolocation) {
    showToast('GPS tidak didukung browser ini');
    return;
  }
  
  if (state.watchId) {
    navigator.geolocation.clearWatch(state.watchId);
  }
  
  state.watchId = navigator.geolocation.watchPosition(
    (pos) => {
      const wasEmpty = !state.lastPos;
      state.lastPos = pos;
      
      // Update UI koordinat
      const c = pos.coords;
      $('coords').textContent = `Lat: ${c.latitude.toFixed(6)} , Lng: ${c.longitude.toFixed(6)}`;
      $('gpsStatus').innerHTML = `📍 ${Math.round(c.accuracy)}m`;
      
      // Reverse geocode
      reverseGeocode(c.latitude, c.longitude);
      
      // Jika tracking aktif, rekam titik
      if (state.isTracking) {
        const newPoint = { lat: c.latitude, lng: c.longitude, timestamp: pos.timestamp };
        
        if (state.points.length > 0) {
          const last = state.points[state.points.length - 1];
          const dist = haversineDistance(last.lat, last.lng, c.latitude, c.longitude);
          
          // Hanya rekam jika bergerak > 3 meter
          if (dist >= 3) {
            state.totalDistance += dist;
            state.points.push(newPoint);
            updatePolyline();
            updateStatsUI();
            showToast(`➕ +${Math.round(dist)}m`, 1000);
            console.log(`[TRACK] +${dist.toFixed(1)}m | Total: ${state.totalDistance.toFixed(1)}m`);
          }
        } else {
          // Titik pertama
          state.points.push(newPoint);
          updateStatsUI();
          showToast('🎯 Titik awal direkam', 1000);
        }
      }
      
      // Update speed UI
      $('speed').innerHTML = formatSpeed(c.speed);
    },
    (err) => {
      console.warn('GPS error:', err);
      showToast(`GPS error: ${err.message}`);
    },
    { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
  );
}

function stopGPS() {
  if (state.watchId) {
    navigator.geolocation.clearWatch(state.watchId);
    state.watchId = null;
  }
}

function updateStatsUI() {
  $('pointCount').innerHTML = state.points.length;
  $('distance').innerHTML = formatDistance(state.totalDistance);
}

// ---------- Reverse Geocode (Cache) ----------
const RG_CACHE_KEY = 'super_track_rg';
function loadRGCache() {
  try {
    const saved = localStorage.getItem(RG_CACHE_KEY);
    if (saved) state.rgCache = JSON.parse(saved);
  } catch(e) {}
}

function saveRGCache() {
  try {
    const toSave = Object.fromEntries(Object.entries(state.rgCache).slice(0, 500));
    localStorage.setItem(RG_CACHE_KEY, JSON.stringify(toSave));
  } catch(e) {}
}

async function reverseGeocode(lat, lon) {
  const key = `${lat.toFixed(4)},${lon.toFixed(4)}`;
  if (state.rgCache[key]) {
    $('locationName').textContent = state.rgCache[key];
    return;
  }
  
  if (!navigator.onLine) {
    $('locationName').textContent = '📍 (offline)';
    return;
  }
  
  try {
    const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=16`;
    const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
    const data = await res.json();
    const name = data.display_name?.split(',')[0] || `${lat.toFixed(5)}, ${lon.toFixed(5)}`;
    state.rgCache[key] = name;
    saveRGCache();
    $('locationName').textContent = name;
    
    if (state.voiceOn) speak(name);
  } catch(e) {
    console.warn('Geocode error:', e);
  }
}

// ---------- Voice ----------
function speak(text) {
  if (!state.voiceOn) return;
  try {
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'id-ID';
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utterance);
  } catch(e) {}
}

$('btnVoice').addEventListener('click', () => {
  state.voiceOn = !state.voiceOn;
  $('btnVoice').textContent = state.voiceOn ? '🔊' : '🔇';
  showToast(`Voice ${state.voiceOn ? 'ON' : 'OFF'}`);
});

// ---------- Tracking Control ----------
function startTracking() {
  if (state.isTracking) return;
  
  state.isTracking = true;
  state.startTime = Date.now();
  $('recordStatus').innerHTML = '🔴 REC';
  $('recordStatus').style.color = '#ef4444';
  $('btnStartTrack').disabled = true;
  $('btnStopTrack').disabled = false;
  
  showToast('🔴 TRACKING DIMULAI! Gerakkan perangkat Anda');
  console.log('TRACKING STARTED');
}

function stopTracking() {
  if (!state.isTracking) return;
  
  state.isTracking = false;
  $('recordStatus').innerHTML = '⚪ STOP';
  $('recordStatus').style.color = '#10b981';
  $('btnStartTrack').disabled = false;
  $('btnStopTrack').disabled = true;
  
  showToast(`⏹ TRACKING STOP. ${state.points.length} titik, ${formatDistance(state.totalDistance)}`);
  console.log(`TRACKING STOPPED: ${state.points.length} points, ${state.totalDistance}m`);
  
  // Final update polyline
  updatePolyline();
}

function resetTracking() {
  if (state.isTracking) stopTracking();
  
  state.points = [];
  state.totalDistance = 0;
  updateStatsUI();
  
  // Remove polyline
  if (state.polyline) {
    state.map.removeLayer(state.polyline);
    state.polyline = null;
  }
  if (state.currentMarker) {
    state.map.removeLayer(state.currentMarker);
    state.currentMarker = null;
  }
  
  showToast('🗑 Semua data tracking direset');
  console.log('TRACKING RESET');
}

$('btnStartTrack').addEventListener('click', startTracking);
$('btnStopTrack').addEventListener('click', stopTracking);
$('btnReset').addEventListener('click', resetTracking);

// ---------- Waypoint ----------
function loadWaypoints() {
  try {
    const saved = localStorage.getItem('super_track_wp');
    if (saved) state.waypoints = JSON.parse(saved);
  } catch(e) {}
  renderWaypointList();
}

function saveWaypoints() {
  localStorage.setItem('super_track_wp', JSON.stringify(state.waypoints));
}

function renderWaypointList() {
  const container = $('waypointList');
  if (!container) return;
  
  if (state.waypoints.length === 0) {
    container.classList.remove('show');
    return;
  }
  
  container.innerHTML = '';
  state.waypoints.forEach((wp, idx) => {
    const div = document.createElement('div');
    div.className = 'wp-item';
    
    let distanceText = '';
    if (state.lastPos) {
      const dist = haversineDistance(state.lastPos.coords.latitude, state.lastPos.coords.longitude, wp.lat, wp.lon);
      distanceText = `${Math.round(dist)}m`;
    }
    
    div.innerHTML = `
      <div class="wp-name">📍 ${wp.name}</div>
      <div class="wp-dist">${distanceText}</div>
    `;
    div.addEventListener('click', () => {
      showToast(`Navigasi ke ${wp.name}`, 1500);
      if (state.voiceOn) speak(`Navigasi ke ${wp.name}`);
    });
    container.appendChild(div);
  });
  container.classList.add('show');
}

$('btnWaypoint').addEventListener('click', () => {
  if (!state.lastPos) {
    showToast('Tunggu GPS aktif');
    return;
  }
  
  const wp = {
    id: Date.now(),
    name: `WP ${state.waypoints.length + 1}`,
    lat: state.lastPos.coords.latitude,
    lon: state.lastPos.coords.longitude,
    timestamp: Date.now()
  };
  state.waypoints.push(wp);
  saveWaypoints();
  renderWaypointList();
  showToast(`✅ Waypoint ${wp.name} disimpan`);
  
  if (state.voiceOn) speak(`Waypoint ${wp.name} disimpan`);
});

$('btnToggleWaypoint').addEventListener('click', () => {
  const container = $('waypointList');
  if (container.classList.contains('show')) {
    container.classList.remove('show');
  } else {
    renderWaypointList();
  }
});

// ---------- Export GPX ----------
function exportGPX() {
  if (state.points.length === 0) {
    showToast('Tidak ada jalur untuk diekspor');
    return;
  }
  
  let gpx = `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="Super Tracking">
  <trk>
    <name>SuperTrack ${new Date().toISOString()}</name>
    <trkseg>
`;
  
  state.points.forEach(p => {
    gpx += `      <trkpt lat="${p.lat}" lon="${p.lng}">
        <time>${new Date(p.timestamp).toISOString()}</time>
      </trkpt>\n`;
  });
  
  gpx += `    </trkseg>
  </trk>
</gpx>`;
  
  const blob = new Blob([gpx], { type: 'application/gpx+xml' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `track_${Date.now()}.gpx`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('📤 GPX siap diunduh');
}

$('btnExport').addEventListener('click', exportGPX);

// ---------- Init App ----------
async function init() {
  try {
    $('loadingScreen').style.display = 'flex';
    
    // Load cache
    loadRGCache();
    loadWaypoints();
    
    // Init map
    initMap();
    
    // Init AR Canvas
    initARCanvas();
    
    // Start camera
    $('loadingStatus').textContent = 'Memulai kamera...';
    await startCamera('environment');
    
    // Start GPS
    $('loadingStatus').textContent = 'Mengaktifkan GPS...';
    startGPS();
    
    // Sembunyikan loading setelah video siap
    const video = $('video');
    video.addEventListener('loadeddata', () => {
      setTimeout(() => {
        $('loadingScreen').style.display = 'none';
        showToast('🚀 SUPER TRACKING SIAP! Klik ▶ mulai tracking');
      }, 500);
    });
    
    // Auto-save waypoints & cache
    setInterval(() => {
      saveWaypoints();
      saveRGCache();
    }, 10000);
    
    console.log('SUPER TRACKING INITIALIZED');
  } catch (err) {
    console.error('Init error:', err);
    $('loadingScreen').style.display = 'none';
    showToast(`Error: ${err.message}`);
  }
}

// Start
init();
</script>
